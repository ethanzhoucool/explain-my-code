name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a stray key in the environment turn a unit test into a paid API call.
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # A venv, not `--system`: the runner's interpreter is externally managed, and
      # `uv venv --python` is also what actually installs the matrix version.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Confirm the matrix version is the one under test
        run: |
          python -V
          python -c "import sys; assert sys.version.startswith('${{ matrix.python }}'), sys.version"

      - name: Confirm every grammar loaded
        # A missing tree-sitter wheel degrades silently at runtime; fail loudly here.
        run: |
          python -c "
          from explain_my_code.core import supported_languages
          missing = [l['id'] for l in supported_languages() if not l['available']]
          assert not missing, f'unavailable parsers: {missing}'
          print('parsers ready:', [l['id'] for l in supported_languages()])
          "

      - name: Test
        run: pytest --cov=explain_my_code --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff
        run: ruff check explain_my_code tests
      - name: Mypy
        run: mypy explain_my_code --ignore-missing-imports
        continue-on-error: true

  api:
    name: api smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Boot the server and exercise the public endpoints
        run: |
          uvicorn explain_my_code.api.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8000/openapi.json > /dev/null
          curl -sf http://127.0.0.1:8000/ | grep -q "Explain My Code"
          curl -sf -X POST http://127.0.0.1:8000/v1/explain \
            -H 'content-type: application/json' \
            -d '{"code":"def f(x):\n    return x * 2\n","level":"developer"}' \
            | grep -q '"language":"python"'

      - name: CLI smoke
        run: |
          printf 'def fib(n):\n    if n <= 1:\n        return n\n    return fib(n-1)+fib(n-2)\n' > /tmp/fib.py
          emc languages
          emc explain /tmp/fib.py --level developer --no-code
          emc metrics /tmp/fib.py --format json | grep -q '"isRecursive": true'

  verify-deploy:
    name: verify deploy
    needs: [test, lint, api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render deploys this repo itself on push (autoDeploy). Nothing here triggers a
      # deploy; this job exists because a Render deploy can *build* fine and then die
      # on start, which leaves the previous build serving and reports nothing. That
      # happened three times in a row once. This turns it into a red run.
      - name: Wait for the deployed version to match this commit
        env:
          URL: https://explain-my-code-w3sj.onrender.com
        run: |
          want=$(python3 -c "
          import re,pathlib
          print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))
          ")
          echo "expecting version $want"
          for i in $(seq 1 45); do
            got=$(curl -sf --max-time 25 "$URL/healthz" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "live on $got after ~$((i*20))s"
              curl -sf --max-time 25 "$URL/healthz" \
                | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          bad=[l['id'] for l in d['languages'] if not l['available']]
          assert not bad, f'parsers unavailable in production: {bad}'
          print('all parsers available in production')
          "
              exit 0
            fi
            echo "attempt $i: serving '${got:-nothing}', want '$want'"
            sleep 20
          done
          echo "::error::production never reported $want — the deploy built but did not start"
          exit 1
